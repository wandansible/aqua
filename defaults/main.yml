---
aqua_arch_map:
  x86_64: amd64
  aarch64: arm64

aqua_github_org: aquaproj
aqua_github_repo: aqua
aqua_github_token: ""
aqua_archive_extension: "tar.gz"
aqua_checksum_filename: checksums.txt
aqua_checksum_type: sha256
aqua_signature_filename: checksums.txt.sigstore.json
aqua_signature_oidc_issuer: "https://token.actions.githubusercontent.com"
aqua_signature_identity_regexp: >-
  https://github\.com/suzuki-shunsuke/go-release-workflow/\.github/workflows/release\.yaml@.*

aqua_version: "latest"

aqua_install: "true"

aqua_update_time: "daily"
aqua_update_randomized_delay: "6h"

aqua_global_install: "false"
aqua_global_install_args: "--only-link"
aqua_global_install_time: "daily"
aqua_global_install_randomized_delay: "6h"

aqua_vacuum_args: ""
aqua_vacuum_time: "never"
aqua_vacuum_randomized_delay: "6h"

aqua_users: []
